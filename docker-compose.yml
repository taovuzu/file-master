services:
  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./server/Dockerfile.api
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    volumes:
      - shared-files:/app/shared
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./server/Dockerfile.worker
    env_file:
      - ./server/.env
    volumes:
      - shared-files:/app/shared
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    ports:
      - "3000:80"
    env_file:
      - ./client/.env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  shared-files:
  redis_data:
